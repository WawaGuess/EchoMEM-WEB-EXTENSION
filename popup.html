<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claw Extension</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Claw</h1>
      <span class="version">v1.0.0</span>
    </header>

    <main class="main">
      <div class="section">
        <h2>HIGO Office 增强</h2>
        <p style="font-size: 13px; color: #666; line-height: 1.6;">
          本扩展为 HIGO Office 提供增强功能。访问 HIGO Office 页面后，在输入框下方会出现快捷按钮：
        </p>
        <ul style="font-size: 13px; color: #666; line-height: 1.8; padding-left: 18px; margin-top: 8px;">
          <li><strong>资源管理</strong> - 管理文件资源</li>
          <li><strong>输入联想</strong> - 开启/关闭智能联想</li>
          <li><strong>认知反馈</strong> - 查看会话分析</li>
          <li><strong>skill商店</strong> - 浏览和管理 Skill</li>
        </ul>
      </div>

      <div class="section">
        <h2>使用提示</h2>
        <div style="
          padding: 12px;
          background: #f0f7ff;
          border-radius: 8px;
          font-size: 13px;
          color: #666;
          border-left: 3px solid #667eea;
        ">
          点击按钮后，右侧面板会显示对应功能。点击面板右上角「×」关闭并恢复用户信息页面。
        </div>
      </div>
    </main>

    <footer class="footer">
      <span style="font-size: 12px; color: #999;">Claw Extension v1.0.0</span>
    </footer>
  </div>
</body>
</html>
