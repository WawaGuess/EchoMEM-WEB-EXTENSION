name: Release EchoMem Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build and validate public and intranet packages
        run: npm run package
        env:
          ECHOMEM_PUBLIC_BASE_URL: ${{ secrets.ECHOMEM_PUBLIC_BASE_URL }}
          ECHOMEM_INTRANET_BASE_URL: ${{ secrets.ECHOMEM_INTRANET_BASE_URL }}

      - name: Zip release packages
        run: |
          cd release
          zip -r EchoMem-Extension-Public.zip EchoMem-Extension-Public
          zip -r EchoMem-Extension-Intranet.zip EchoMem-Extension-Intranet

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/EchoMem-Extension-Public.zip
            release/EchoMem-Extension-Intranet.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
