<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EchoMem Periodic Review Preview</title>
  <style>
    html, body, #app { width: 100%; height: 100%; margin: 0; }
    body { background: #02070b; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { mountViewSwitcher } from '../src/panels/feedback/view-switcher.js';
    import { renderSummary, cleanupSummary } from '../src/panels/feedback/summary/summary-view.js';
    import { injectFeedbackTheme } from '../src/panels/feedback/feedback-theme.js';

    mountViewSwitcher(document.getElementById('app'), {
      defaultKey: 'summary',
      views: [
        {
          key: 'summary',
          label: '周期总结',
          mount: (element) => {
            injectFeedbackTheme(element);
            renderSummary(element);
          },
          cleanup: (element) => {
            cleanupSummary(element);
            element.innerHTML = '';
          },
        },
      ],
    });
  </script>
</body>
</html>
